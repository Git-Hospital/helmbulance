# The cases whose right answer is known. tools/verdicts runs each one and compares the exit code,
# the verdict of every scenario and the findings with what is written here; docs/verdict-quality.md
# explains how to read and extend it.
#
# A pair is one defect case and its fixed twin: the same chart with and without one defect. A
# finding ID counts as covered when the defect case expects it and the twin does not.
# The texts after a finding ID must appear in its evidence, so the finding is about the right object.

# Finding IDs the source can emit that no pair covers yet. The check fails for any other uncovered
# ID, and for an ID that is still listed here once a pair covers it.
uncovered:
  HB-CU-002: no fixture yet for an upgrade to a new chart version that changes a Secret
  HB-CU-003: no fixture yet for a new chart version whose workloads do not become healthy
  HB-K8S-004: no fixture yet for an API server warning, other than a deprecation, about an object the chart creates
  HB-RI-002: no fixture yet for a volume that survives a reinstall and comes back without its data
  HB-RI-003: no fixture yet for a chart that does not install again after helm uninstall
  HB-K8S-001: no fixture yet for a chart that does not install on one Kubernetes version
  HB-K8S-002: no fixture yet for a chart that installs on one Kubernetes version and does not become healthy
  HB-SCAN-002: no fixture yet for a checksum annotation that changes on the first upgrade

cases:
  # upgrade-without-values
  - name: regenerates-secret
    pair: secret-regeneration
    role: defect
    command: test
    args: [testdata/charts/regenerates-secret, --scenario, upgrade-without-values]
    exit: 1
    verdicts: {upgrade-without-values: FAIL}
    findings:
      HB-UV-001: [hb-upgrade-secret/password]
      HB-UV-003: [Deployment/hb-upgrade-app]
  - name: keeps-secret
    pair: secret-regeneration
    role: fixed
    command: test
    args: [testdata/charts/keeps-secret, --scenario, upgrade-without-values]
    exit: 0
    verdicts: {upgrade-without-values: PASS}
  # The regenerated password crash-loops the database, so the control upgrade times out (#35): the
  # timeout is the finding, not INCONCLUSIVE. Its twin is keeps-secret, because a pair takes exactly
  # one twin.
  - name: regenerates-db-password
    pair: db-password-regeneration
    role: defect
    command: test
    args: [testdata/charts/regenerates-db-password, --scenario, upgrade-without-values]
    exit: 1
    verdicts: {upgrade-without-values: FAIL}
    findings:
      HB-UV-001: [hb-upgrade-db/password]
  - name: keeps-secret-for-db-password
    pair: db-password-regeneration
    role: fixed
    command: test
    args: [testdata/charts/keeps-secret, --scenario, upgrade-without-values]
    exit: 0
    verdicts: {upgrade-without-values: PASS}
  # More fixed twins, not pairs of their own: Secrets the release stops rendering or never renders,
  # and a Secret a workload rewrites, must not be findings.
  - name: generate-once
    pair: secret-regeneration
    role: fixed
    command: test
    args: [testdata/charts/generate-once, --scenario, upgrade-without-values]
    exit: 0
    verdicts: {upgrade-without-values: PASS}
  - name: runtime-secret
    pair: secret-regeneration
    role: fixed
    command: test
    args: [testdata/charts/runtime-secret, -f, testdata/charts/runtime-secret/values.yaml, --scenario, upgrade-without-values]
    exit: 0
    verdicts: {upgrade-without-values: PASS}

  - name: drops-set-key
    pair: set-key
    role: defect
    command: test
    args: [testdata/charts/drops-set-key, --set, "encryptionKey={key}", --scenario, upgrade-without-values]
    exit: 1
    verdicts: {upgrade-without-values: FAIL}
    findings:
      HB-UV-002: [hb-upgrade-secret/encryption-key]
  - name: keeps-set-key
    pair: set-key
    role: fixed
    command: test
    args: [testdata/charts/keeps-set-key, --set, "encryptionKey={key}", --scenario, upgrade-without-values]
    exit: 0
    verdicts: {upgrade-without-values: PASS}
  # A chart that refuses to render without the key keeps the data safe: a PASS that "refuses
  # safely" (D4, #49).
  - name: refuses-dropped-key
    pair: set-key
    role: fixed
    command: test
    args: [testdata/charts/refuses-dropped-key, --set, "encryptionKey={key}", --scenario, upgrade-without-values]
    exit: 0
    verdicts: {upgrade-without-values: PASS}

  # chart-upgrade
  - name: upgrade-v2-breaks
    pair: upgrade-v2
    role: defect
    command: test
    args: [testdata/charts/upgrade-v2-breaks, --scenario, chart-upgrade, --from, testdata/charts/upgrade-v1, --from-version, 1.0.0]
    exit: 1
    verdicts: {chart-upgrade: FAIL}
    findings:
      HB-CU-001: [spec.selector, field is immutable]
  - name: upgrade-v2-ok
    pair: upgrade-v2
    role: fixed
    command: test
    args: [testdata/charts/upgrade-v2-ok, --scenario, chart-upgrade, --from, testdata/charts/upgrade-v1, --from-version, 1.0.0]
    exit: 0
    verdicts: {chart-upgrade: PASS}
  # v2 crash-loops, so --wait times out (the full --timeout): a finding, not INCONCLUSIVE (#28).
  # Its own fixed twin is the same chart as upgrade-v2-ok, because a pair takes exactly one twin.
  - name: upgrade-v2-crashes
    pair: upgrade-v2-crash
    role: defect
    command: test
    args: [testdata/charts/upgrade-v2-crashes, --scenario, chart-upgrade, --from, testdata/charts/upgrade-v1, --from-version, 1.0.0]
    exit: 1
    verdicts: {chart-upgrade: FAIL}
    findings:
      HB-CU-001: []
  - name: upgrade-v2-ok-for-crash
    pair: upgrade-v2-crash
    role: fixed
    command: test
    args: [testdata/charts/upgrade-v2-ok, --scenario, chart-upgrade, --from, testdata/charts/upgrade-v1, --from-version, 1.0.0]
    exit: 0
    verdicts: {chart-upgrade: PASS}

  # reinstall: the credentials must still match the data that was kept
  - name: reinstall-loses-creds
    pair: reinstall-creds
    role: defect
    command: test
    args: [testdata/charts/reinstall-loses-creds, --scenario, reinstall]
    exit: 1
    verdicts: {reinstall: FAIL}
    findings:
      HB-RI-001: []
  - name: reinstall-keeps-creds
    pair: reinstall-creds
    role: fixed
    command: test
    args: [testdata/charts/reinstall-keeps-creds, --scenario, reinstall]
    exit: 0
    verdicts: {reinstall: PASS}
  # Not a pair: a templated claim is deleted with the release, so new credentials lose nothing.
  - name: reinstall-templated-pvc
    pair: reinstall-creds
    role: fixed
    command: test
    args: [testdata/charts/reinstall-templated-pvc, --scenario, reinstall]
    exit: 0
    verdicts: {reinstall: PASS}

  # The same defect when the password is a file from a projected volume (#73). Its twin mounts only
  # a key that does not change.
  - name: reinstall-loses-creds-projected
    pair: reinstall-projected
    role: defect
    command: test
    args: [testdata/charts/reinstall-loses-creds-projected, --scenario, reinstall]
    exit: 1
    verdicts: {reinstall: FAIL}
    findings:
      HB-RI-001: [hb-reinstall-db/password]
  - name: reinstall-projected-items-other-key
    pair: reinstall-projected
    role: fixed
    command: test
    args: [testdata/charts/reinstall-projected-items-other-key, --scenario, reinstall]
    exit: 0
    verdicts: {reinstall: PASS}

  # A pre-install hook Secret kept on uninstall is created again, with new values, by the next
  # install (HB-RI-004, #43). Its twin reuses the values with lookup; a hook Secret that is not
  # kept is replaced along with the release, which is no finding.
  - name: reinstall-replaces-kept-hook
    pair: reinstall-kept-hook
    role: defect
    command: test
    args: [testdata/charts/reinstall-replaces-kept-hook, --scenario, reinstall]
    exit: 1
    verdicts: {reinstall: FAIL}
    findings:
      HB-RI-004: [hb-reinstall-db]
  - name: reinstall-reuses-kept-hook
    pair: reinstall-kept-hook
    role: fixed
    command: test
    args: [testdata/charts/reinstall-reuses-kept-hook, --scenario, reinstall]
    exit: 0
    verdicts: {reinstall: PASS}
  - name: reinstall-replaces-plain-hook
    pair: reinstall-kept-hook
    role: fixed
    command: test
    args: [testdata/charts/reinstall-replaces-plain-hook, --scenario, reinstall]
    exit: 0
    verdicts: {reinstall: PASS}
  # The same, with an app that never gets ready: the replaced kept Secret is still a finding. The
  # twin has nothing to report, and a release that is never ready is INCONCLUSIVE (#43).
  - name: reinstall-unready-replaces-kept
    pair: reinstall-unready-kept-hook
    role: defect
    command: test
    args: [testdata/charts/reinstall-unready-replaces-kept, --scenario, reinstall, --timeout, 45s]
    exit: 1
    verdicts: {reinstall: FAIL}
    findings:
      HB-RI-004: [hb-reinstall-db]
  - name: reinstall-unready-reuses-kept
    pair: reinstall-unready-kept-hook
    role: fixed
    command: test
    args: [testdata/charts/reinstall-unready-reuses-kept, --scenario, reinstall, --timeout, 45s]
    exit: 3
    verdicts: {reinstall: INCONCLUSIVE}

  # gitops-render: a password generated behind lookup changes on every client-side render. Its
  # twin takes it from values.
  - name: gitops-lookup-random
    pair: gitops-secret
    role: defect
    command: test
    args: [testdata/charts/gitops-lookup-random, --scenario, gitops-render]
    exit: 1
    verdicts: {gitops-render: FAIL}
    findings:
      HB-GR-001: []
  - name: gitops-values-secret
    pair: gitops-secret
    role: fixed
    command: test
    args: [testdata/charts/gitops-values-secret, --scenario, gitops-render]
    exit: 0
    verdicts: {gitops-render: PASS}
  # A password made in an install-only hook: Helm never runs the hook again, Argo CD runs it on
  # every sync (#45). Its twin's hook runs on upgrade too, so upgrade-without-values reports it.
  - name: gitops-install-hook
    pair: gitops-install-hook
    role: defect
    command: test
    args: [testdata/charts/gitops-install-hook, --scenario, gitops-render]
    exit: 1
    verdicts: {gitops-render: FAIL}
    findings:
      HB-GR-001: [hb-gitops-db/password, "`hb-gitops-db` is a `pre-install` hook"]
  - name: gitops-upgrade-hook
    pair: gitops-install-hook
    role: fixed
    command: test
    args: [testdata/charts/gitops-upgrade-hook, --scenario, gitops-render]
    exit: 0
    verdicts: {gitops-render: PASS}
  # A Secret rendered only under .Release.IsInstall, kept by Helm, rendered anew by Argo CD (#45).
  - name: gitops-install-only
    pair: gitops-install-only
    role: defect
    command: test
    args: [testdata/charts/gitops-install-only, --scenario, gitops-render]
    exit: 1
    verdicts: {gitops-render: FAIL}
    findings:
      HB-GR-001: [hb-gitops-db/password]
  - name: gitops-values-secret-for-install-only
    pair: gitops-install-only
    role: fixed
    command: test
    args: [testdata/charts/gitops-values-secret, --scenario, gitops-render]
    exit: 0
    verdicts: {gitops-render: PASS}

  # zero-downtime
  - name: zd-recreate
    pair: zero-downtime
    role: defect
    command: test
    args: [testdata/charts/zd-recreate, --scenario, zero-downtime]
    exit: 1
    verdicts: {zero-downtime: FAIL}
    findings:
      HB-ZD-001: [Deployment/hb-zd-web, Recreate]
  - name: zd-rolling
    pair: zero-downtime
    role: fixed
    command: test
    args: [testdata/charts/zd-rolling, --scenario, zero-downtime]
    exit: 0
    verdicts: {zero-downtime: PASS}

  # A run that cannot finish is INCONCLUSIVE, never a finding and never a PASS.
  - name: unpullable-image
    role: incomplete
    command: test
    args: [testdata/charts/unpullable-image, --scenario, upgrade-without-values, --timeout, 45s]
    exit: 3
    verdicts: {upgrade-without-values: INCONCLUSIVE}

  # Static scan: no cluster, seconds. --strict makes candidates exit 1.
  - name: scan-regenerates-secret
    pair: scan-secret-regeneration
    role: defect
    command: scan
    args: [testdata/charts/regenerates-secret, --strict]
    exit: 1
    verdicts:
      scan:immutable-fields: SKIPPED
      scan:first-upgrade-restart: PASS
      scan:regenerated-secrets: FAIL
      scan:unquoted-values: PASS
      scan:duplicate-env: PASS
    findings:
      HB-SCAN-003: [Secret/hb-secret, password]
  - name: scan-keeps-secret
    pair: scan-secret-regeneration
    role: fixed
    command: scan
    args: [testdata/charts/keeps-secret, --strict]
    exit: 0
    verdicts:
      scan:immutable-fields: SKIPPED
      scan:first-upgrade-restart: PASS
      scan:regenerated-secrets: PASS
      scan:unquoted-values: PASS
      scan:duplicate-env: PASS

  # A quoted default that renders another field unquoted (an env value becomes valueFrom). Its twin
  # renders scalars alike.
  - name: scan-unquoted-env
    pair: scan-unquoted-values
    role: defect
    command: scan
    args: [testdata/charts/scan-unquoted-env, --strict]
    exit: 1
    verdicts:
      scan:immutable-fields: SKIPPED
      scan:first-upgrade-restart: PASS
      scan:regenerated-secrets: PASS
      scan:unquoted-values: FAIL
      scan:duplicate-env: PASS
    findings:
      HB-SCAN-004: [extraEnv.DB_PORT, "env[DB_PORT].valueFrom"]
  - name: scan-typed-env
    pair: scan-unquoted-values
    role: fixed
    command: scan
    args: [testdata/charts/scan-typed-env, --strict]
    exit: 0
    verdicts:
      scan:immutable-fields: SKIPPED
      scan:first-upgrade-restart: PASS
      scan:regenerated-secrets: PASS
      scan:unquoted-values: PASS
      scan:duplicate-env: PASS

  - name: scan-upgrade-v2-breaks
    pair: scan-upgrade-v2
    role: defect
    command: scan
    args: [testdata/charts/upgrade-v2-breaks, --from, testdata/charts/upgrade-v1, --from-version, 1.0.0, --strict]
    exit: 1
    verdicts:
      scan:immutable-fields: FAIL
      scan:first-upgrade-restart: PASS
      scan:regenerated-secrets: PASS
      scan:unquoted-values: PASS
      scan:duplicate-env: PASS
    findings:
      HB-SCAN-001: [Deployment/hb-app, spec.selector]
  - name: scan-upgrade-v2-ok
    pair: scan-upgrade-v2
    role: fixed
    command: scan
    args: [testdata/charts/upgrade-v2-ok, --from, testdata/charts/upgrade-v1, --from-version, 1.0.0, --strict]
    exit: 0
    verdicts:
      scan:immutable-fields: PASS
      scan:first-upgrade-restart: PASS
      scan:regenerated-secrets: PASS
      scan:unquoted-values: PASS
      scan:duplicate-env: PASS

  # A container that names an environment variable twice (HB-SCAN-005, #61). Its twin names it once.
  - name: scan-duplicate-env
    pair: scan-duplicate-env
    role: defect
    command: scan
    args: [testdata/charts/scan-duplicate-env, --set, extraEnv.DB_PASSWORD=from-values, --strict]
    exit: 1
    verdicts:
      scan:immutable-fields: SKIPPED
      scan:first-upgrade-restart: PASS
      scan:regenerated-secrets: PASS
      scan:unquoted-values: PASS
      scan:duplicate-env: FAIL
    findings:
      HB-SCAN-005: [Deployment/hb-app, DB_PASSWORD]
  - name: scan-single-env
    pair: scan-duplicate-env
    role: fixed
    command: scan
    args: [testdata/charts/scan-single-env, --set, extraEnv.DB_PASSWORD=from-values, --strict]
    exit: 0
    verdicts:
      scan:immutable-fields: SKIPPED
      scan:first-upgrade-restart: PASS
      scan:regenerated-secrets: PASS
      scan:unquoted-values: PASS
      scan:duplicate-env: PASS

  # A chart that does not render: the checks that need a render are INCONCLUSIVE, and --strict
  # exits 3 (#50).
  - name: scan-render-fails
    role: incomplete
    command: scan
    args: [testdata/charts/scan-render-fails, --strict]
    exit: 3
    verdicts:
      scan:immutable-fields: SKIPPED
      scan:first-upgrade-restart: PASS
      scan:regenerated-secrets: INCONCLUSIVE
      scan:unquoted-values: PASS
      scan:duplicate-env: INCONCLUSIVE

  # Refused before any check runs: exit 2, no report (#68).
  - name: scan-missing-chart
    role: setup-error
    command: scan
    args: [./testdata/charts/does-not-exist, --strict]
    exit: 2
    log: [not found]
  - name: scan-missing-values
    role: setup-error
    command: scan
    args: [testdata/charts/regenerates-secret, -f, testdata/charts/regenerates-secret/does-not-exist.yaml, --strict]
    exit: 2
    log: [not found]

  # Kubernetes matrix, on one version.
  - name: matrix-deprecated-api
    pair: api-versions
    role: defect
    command: matrix
    args: [testdata/charts/deprecated-api]
    exit: 1
    verdicts: {"k8s-{k8s}": FAIL}
    findings:
      HB-K8S-003: [Endpoints]
  - name: matrix-current-api
    pair: api-versions
    role: fixed
    command: matrix
    args: [testdata/charts/current-api]
    exit: 0
    verdicts: {"k8s-{k8s}": PASS}
