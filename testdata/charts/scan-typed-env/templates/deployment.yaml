apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app
spec:
  replicas: 1
  selector:
    matchLabels: {app: {{ .Release.Name }}-app}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-app}
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          env:
          {{- range $key, $value := .Values.extraEnv }}
            - name: {{ $key }}
            {{- /* The fix: a map is a valueFrom; anything else is a value, whatever its YAML type. */}}
            {{- if kindIs "string" $value }}
              value: {{ $value | quote }}
            {{- else if kindIs "map" $value }}
              valueFrom: {{ toYaml $value | nindent 16 }}
            {{- else }}
              value: {{ toJson $value | quote }}
            {{- end }}
          {{- end }}
