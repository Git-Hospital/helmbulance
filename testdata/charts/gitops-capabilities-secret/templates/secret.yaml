# Built from the cluster's Kubernetes version and whether it serves apps/v1 Deployments. helm
# template without --kube-version and --api-versions uses helm's own defaults, so the value would
# differ from the release's for that reason alone.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db
type: Opaque
data:
  password: {{ .Values.password | b64enc }}
  cluster: {{ printf "%s/%t" .Capabilities.KubeVersion.Version (.Capabilities.APIVersions.Has "apps/v1/Deployment") | b64enc }}
