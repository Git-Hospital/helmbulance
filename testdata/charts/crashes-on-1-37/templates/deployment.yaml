apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65535}
      containers:
        - name: app
          image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1@sha256:a9155b13325b2abef48e71de77bb8ac015412a566829f621d06bfae5c699b1b9
          # Stands for a changed default on a newer version: the container fails at start there
          # and runs everywhere else.
          {{- if semverCompare ">=1.37-0" .Capabilities.KubeVersion.Version }}
          command: ["false"]
          {{- else }}
          command: ["sleep", "3600"]
          {{- end }}
          # Without a readiness probe the container is Ready the moment it starts, and helm's --wait
          # returns before the first crash.
          readinessProbe:
            exec: {command: ["true"]}
            initialDelaySeconds: 3
            periodSeconds: 2
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
