{{- /* The usual "generate once" pattern: only the install renders the Secret. */}}
{{- $name := printf "%s-secret" .Release.Name }}
{{- if not (lookup "v1" "Secret" .Release.Namespace $name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
data:
  password: {{ randAlphaNum 32 | b64enc }}
{{- end }}
