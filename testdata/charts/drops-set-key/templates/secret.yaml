apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
# data, not stringData: a key removed from stringData stays in the Secret, which would hide
# the bug this fixture is about.
data:
  placeholder: {{ "x" | b64enc }}
  {{- with .Values.encryptionKey }}
  encryption-key: {{ . | b64enc }}
  {{- end }}
