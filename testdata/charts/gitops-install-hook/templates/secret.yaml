{{- /* Helm runs a pre-install hook once, at install, and never on upgrade, so the password
stays. Argo CD maps it to PreSync and runs it on every sync, with BeforeHookCreation. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
data:
  password: {{ randAlphaNum 24 | b64enc }}
