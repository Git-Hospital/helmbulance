# The defect: the Secret outlives helm uninstall (a hook, and kept), but the next install's hook
# deletes and creates it again with a new password. Seen in seaweedfs's filer db secret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db
  annotations:
    helm.sh/resource-policy: keep
    helm.sh/hook: pre-install
stringData:
  user: app
  password: {{ randAlphaNum 32 | quote }}
