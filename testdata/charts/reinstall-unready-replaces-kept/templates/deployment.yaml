# Stands in for a client of a database outside the release: no volume, only the credentials.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app
spec:
  replicas: 1
  selector:
    matchLabels: {app: {{ .Release.Name }}-app}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-app}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65535}
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          # Nothing listens on port 1, so the release never becomes ready, like a client whose
          # database outside the cluster is not there.
          readinessProbe: {tcpSocket: {port: 1}, periodSeconds: 2}
          env:
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: {{ .Release.Name }}-db, key: user}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Release.Name }}-db, key: password}}
