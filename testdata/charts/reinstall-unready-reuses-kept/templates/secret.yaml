# The fix: the hook is still deleted and created again on every install, so it reads the kept
# Secret first and writes the same values back.
{{- $name := printf "%s-db" .Release.Name }}
{{- $data := (lookup "v1" "Secret" .Release.Namespace $name | default dict).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
    helm.sh/hook: pre-install
data:
  user: {{ $data.user | default ("app" | b64enc) }}
  password: {{ $data.password | default (randAlphaNum 32 | b64enc) }}
