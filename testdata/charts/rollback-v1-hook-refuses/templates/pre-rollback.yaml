# Checks the data before a rollback and refuses a format it cannot read.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-pre-rollback
  annotations:
    "helm.sh/hook": pre-rollback
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65535, runAsGroup: 65535, fsGroup: 65535}
      containers:
        - name: check
          image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1@sha256:a9155b13325b2abef48e71de77bb8ac015412a566829f621d06bfae5c699b1b9
          command:
            - sh
            - -c
            - |
              if [ "$(cat /data/format)" -gt 1 ]; then
                echo "refusing to roll back: the data is in format $(cat /data/format), which this version cannot read" >&2
                exit 1
              fi
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: data-{{ .Release.Name }}-db-0}
