{{- /* Rendered at install only. On upgrade the Secret is not in the manifest, and keep stops
Helm deleting it. helm template sets .Release.IsInstall, so a GitOps render always has it. */}}
{{- if .Release.IsInstall }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ randAlphaNum 24 | b64enc }}
{{- end }}
