apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app
spec:
  replicas: 1
  selector:
    matchLabels: {app: {{ .Release.Name }}-app}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-app}
      # Restart when a user-given value changes. Hashing the rendered secret.yaml instead would
      # differ between the install (lookup finds nothing, a second random value is drawn) and the
      # first upgrade, and restart the pods once for nothing.
      annotations:
        checksum/values: {{ toJson .Values | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65535}
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          envFrom:
            - secretRef: {name: {{ .Release.Name }}-secret}
