apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app
spec:
  replicas: 1
  selector:
    matchLabels: {app: {{ .Release.Name }}-app}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-app}
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          env:
            {{- /* The fix: a name extraEnv sets replaces the chart's entry. */}}
            {{- if not (hasKey .Values.extraEnv "DB_PASSWORD") }}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Release.Name }}-db, key: password}}
            {{- end }}
          {{- range $key, $value := .Values.extraEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
          {{- end }}
