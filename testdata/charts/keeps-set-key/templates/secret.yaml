{{- $name := printf "%s-secret" .Release.Name }}
{{- $stored := "" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing (index $existing.data "encryption-key") }}
{{- $stored = index $existing.data "encryption-key" | b64dec }}
{{- end }}
{{- $key := .Values.encryptionKey | default $stored }}
{{- if and $stored (ne $stored $key) }}
{{- fail "encryptionKey differs from the key already in use" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
# data, not stringData: a key removed from stringData stays in the Secret, which would hide
# the bug this fixture is about.
data:
  placeholder: {{ "x" | b64enc }}
  {{- with $key }}
  encryption-key: {{ . | b64enc }}
  {{- end }}
