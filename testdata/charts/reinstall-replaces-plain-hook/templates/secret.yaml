# Not a defect: a hook Helm leaves after uninstall only because hooks are not part of the release
# manifest. Without helm.sh/resource-policy: keep the chart does not ask for it back, and the next
# install's before-hook-creation deletes and makes it again, as for a Secret the uninstall deleted.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db
  annotations:
    helm.sh/hook: pre-install
stringData:
  user: app
  password: {{ randAlphaNum 32 | quote }}
