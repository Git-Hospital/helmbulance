{{- if .Release.IsUpgrade }}{{ fail "PASSWORDS ERROR: You must provide your current passwords when upgrading the release." }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db
stringData:
  password: {{ randAlphaNum 16 | quote }}
---
# Made once at install under Helm, on every sync under Argo CD.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-init
  annotations:
    helm.sh/hook: pre-install
stringData:
  token: {{ randAlphaNum 16 | quote }}
