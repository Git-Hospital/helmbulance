{{- /* Helm runs this hook on install and on every upgrade, so the password changes under
Helm too: not a GitOps-only drift. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
data:
  password: {{ randAlphaNum 24 | b64enc }}
