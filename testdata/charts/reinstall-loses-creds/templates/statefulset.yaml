# Stands in for a database: the volume claim template outlives helm uninstall, as Kubernetes keeps
# a StatefulSet's claims, and the password is what the data was initialised with.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-db
spec:
  serviceName: {{ .Release.Name }}-db
  replicas: 1
  selector:
    matchLabels: {app: {{ .Release.Name }}-db}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-db}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65535}
      containers:
        - name: db
          # Like a database: the first start stores the password next to the data, and a later start
          # with another password is refused. It stays up for 10 s first, so helm's --wait finishes
          # and the refusal is seen after the reinstall, not as a timeout (#53).
          image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command:
            - sh
            - -c
            - |
              if [ -f /data/password ] && [ "$(cat /data/password)" != "$DB_PASSWORD" ]; then
                echo "password authentication failed: the data was initialised with another password" >&2
                sleep 10; exit 1
              fi
              printf %s "$DB_PASSWORD" > /data/password
              exec sleep 2147483647
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          env:
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Release.Name }}-db, key: password}}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 10Mi}}
