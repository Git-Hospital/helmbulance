# A one-master, one-tserver universe, as in yugabyte/charts#240, small enough for a CI runner. No
# LoadBalancer Services, since kind has no load balancer.
replicas:
  master: 1
  tserver: 1
  totalMasters: 1
storage:
  master:
    count: 1
    size: 1Gi
  tserver:
    count: 1
    size: 1Gi
resource:
  master:
    requests: {cpu: "0.5", memory: 1Gi}
    limits: {cpu: "1", memory: 1Gi}
  tserver:
    requests: {cpu: "0.5", memory: 1Gi}
    limits: {cpu: "1", memory: 1Gi}
enableLoadBalancer: false
