# The known-bug corpus (docs/corpus.md; decision 0001, D3 and D8): real charts with a documented
# day-two defect, each next to the version that fixed it. A third-party chart runs here without the
# protections of docs/architecture.md §4, so every chart gets its own job on a fresh VM, with a token
# that has no permissions, no secrets and no caches, and its archive is pinned by sha256.
name: Corpus

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: corpus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  chart:
    name: ${{ matrix.id }} ${{ matrix.chart }} ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include:
          # HBC-01: the admin password is generated anew on every upgrade (grafana/helm-charts#10).
          - id: HBC-01
            chart: grafana
            version: 6.9.2
            url: https://github.com/grafana/helm-charts/releases/download/grafana-6.9.2/grafana-6.9.2.tgz
            sha256: a2bd055c04e7184dccbec175ba04948f5798fc3e0a47d46c03d7fb963ae6d785
            values: testdata/corpus/hbc-01-grafana/values.yaml
            scenario: upgrade-without-values
            exit-code: 1
            findings: HB-UV-001 HB-UV-003
          # 6.9.3 keeps the password. Its pods are still replaced by the first upgrade.
          - id: HBC-01
            chart: grafana
            version: 6.9.3
            url: https://github.com/grafana/helm-charts/releases/download/grafana-6.9.3/grafana-6.9.3.tgz
            sha256: 52de98e1ad86674df4b52076e8b1fcf4cc29f8d4d5aa2e26f6d0bb8646247978
            values: testdata/corpus/hbc-01-grafana/values.yaml
            scenario: upgrade-without-values
            exit-code: 1
            findings: HB-UV-003
          # HBC-02: the first upgrade after install restarts the filer and the S3 gateway although nothing
          # changed (seaweedfs/seaweedfs#11719, found with Helmbulance). Fixed by #11720, first released in
          # 4.50.0: the 4.49.0 chart points at an image tag that was never pushed, so it cannot install.
          - id: HBC-02
            chart: seaweedfs
            version: 4.48.0
            url: https://seaweedfs.github.io/seaweedfs/helm/seaweedfs-4.48.0.tgz
            sha256: fa9beb4b68ee1e56129779643194968210381a33caf47fc177fd17d43efb686e
            values: testdata/corpus/hbc-02-seaweedfs/values.yaml
            scenario: upgrade-without-values
            timeout: 10m
            exit-code: 1
            findings: HB-UV-003
          - id: HBC-02
            chart: seaweedfs
            version: 4.50.0
            url: https://seaweedfs.github.io/seaweedfs/helm/seaweedfs-4.50.0.tgz
            sha256: d8eb55cf7ab64bacedf46eac00c96db3bfaa72357c3c6153da66226d3f36b90e
            values: testdata/corpus/hbc-02-seaweedfs/values.yaml
            scenario: upgrade-without-values
            timeout: 10m
            exit-code: 0
            findings: ""
          # HBC-03: haSharedSecret is generated anew on every render (twuni/docker-registry.helm#187). No
          # published version fixes it: a lookup fix (#56) was declined in 2022.
          - id: HBC-03
            chart: docker-registry
            version: 3.0.0
            url: https://twuni.github.io/docker-registry.helm/docker-registry-3.0.0.tgz
            sha256: 4279fca80994602f2b43edad632afed3608d88232d3f53fd86137647bb842304
            values: ""
            scenario: upgrade-without-values
            exit-code: 1
            findings: HB-UV-001 HB-UV-003
          # HBC-04: rendered without cluster access, as Argo CD renders it, the admin password is new on
          # every render (jenkinsci/helm-charts#1026). With cluster access the chart's lookup keeps it. No
          # published version changes this.
          - id: HBC-04
            chart: jenkins
            version: 5.10.0
            url: https://github.com/jenkinsci/helm-charts/releases/download/jenkins-5.10.0/jenkins-5.10.0.tgz
            sha256: ef1c1de44d20eff12e6b46ebde663c24054bef029be4597638011676b1b72df7
            values: ""
            scenario: gitops-render
            timeout: 10m
            exit-code: 1
            findings: HB-GR-001
          # HBC-05: the first upgrade after install restarts the hub and the proxy although nothing changed
          # (jupyterhub/zero-to-jupyterhub-k8s#3996, found with Helmbulance; fix #3997 not released yet).
          - id: HBC-05
            chart: jupyterhub
            version: 4.4.2
            url: https://jupyterhub.github.io/helm-chart/jupyterhub-4.4.2.tgz
            sha256: 0ddfa517050d16f2e1b50c62b5b6377b12574f9a2b88f3b352bd211ef3173c3e
            values: testdata/corpus/hbc-05-jupyterhub/values.yaml
            scenario: upgrade-without-values
            exit-code: 1
            findings: HB-UV-003
          # HBC-06: the same restart, for Semaphore (semaphoreui/charts#34, found with Helmbulance; fix #35
          # not released yet).
          - id: HBC-06
            chart: semaphore
            version: 16.2.2
            url: https://github.com/semaphoreui/charts/releases/download/semaphore-16.2.2/semaphore-16.2.2.tgz
            sha256: a7802961495579054262740908e71effa9d8d5858a15ef187d2de77498b35945
            values: ""
            scenario: upgrade-without-values
            exit-code: 1
            findings: HB-UV-003
          # HBC-07: the Deployment selector holds the app version, so 1.1.3 to 1.1.4 fails on an immutable
          # field (found by `helmbulance scan`; the open fix Joxit/helm-charts#22 is not released yet).
          - id: HBC-07
            chart: docker-registry-ui
            version: 1.1.4
            url: https://github.com/Joxit/helm-charts/releases/download/docker-registry-ui-1.1.4/docker-registry-ui-1.1.4.tgz
            sha256: fa585f1ed6345d1fe2097460097438c321e06f2c3818ffc1b77a5596f578052d
            from-url: https://github.com/Joxit/helm-charts/releases/download/docker-registry-ui-1.1.3/docker-registry-ui-1.1.3.tgz
            from-sha256: efe5c85c022c4f3bf53ef1da01990840fff5a578ceaa0ab68c584aad63d8b129
            from-version: 1.1.3
            values: ""
            scenario: chart-upgrade
            exit-code: 1
            findings: HB-CU-001
          # HBC-08: patch release 2026.1.2 changes the StatefulSet selectors, so every upgrade from 2026.1.1
          # fails with the default oldNamingStyle (yugabyte/charts#240, found with Helmbulance; no fix yet).
          - id: HBC-08
            chart: yugabyte
            version: 2026.1.2
            url: https://charts.yugabyte.com/yugabyte-2026.1.2.tgz
            sha256: bb8a12e9476e7624f98f9f63ba7867231f6379b463ffe2d4fea8d9903e7729c5
            from-url: https://charts.yugabyte.com/yugabyte-2026.1.1.tgz
            from-sha256: e651769b33ab737fd562ad6446ea394bb60fae5db0385991c4aeff073ef3f13e
            from-version: 2026.1.1
            values: testdata/corpus/hbc-08-yugabyte/values.yaml
            scenario: chart-upgrade
            timeout: 10m
            exit-code: 1
            findings: HB-CU-001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the chart
        env:
          URL: ${{ matrix.url }}
          SHA256: ${{ matrix.sha256 }}
          FROM_URL: ${{ matrix.from-url }}
          FROM_SHA256: ${{ matrix.from-sha256 }}
        run: |
          curl -fsSLo corpus-chart.tgz "$URL"
          echo "$SHA256  corpus-chart.tgz" | sha256sum -c -
          # chart-upgrade entries also pin the version they upgrade from.
          if [ -n "$FROM_URL" ]; then
            curl -fsSLo corpus-from.tgz "$FROM_URL"
            echo "$FROM_SHA256  corpus-from.tgz" | sha256sum -c -
          fi

      - name: Run Helmbulance
        id: hb
        uses: ./ # zizmor: ignore[self-repository] only this commit is checked out; switch to $/ once confirmed for a root action
        with:
          chart: corpus-chart.tgz
          values: ${{ matrix.values }}
          scenarios: ${{ matrix.scenario }}
          from: ${{ matrix.from-url && 'corpus-from.tgz' || '' }}
          from-version: ${{ matrix.from-version }}
          timeout: ${{ matrix.timeout || '5m' }}
          report-dir: corpus-report
          fail-on: never

      # One test per line: under `bash -e` only the last command of an `&&` list can fail the step.
      - name: Compare with the expected result
        env:
          WANT_CODE: ${{ matrix.exit-code }}
          WANT_IDS: ${{ matrix.findings }}
          GOT_CODE: ${{ steps.hb.outputs.exit-code }}
        run: |
          # A run that wrote no report is never "no findings".
          test -s corpus-report/report.json
          got_ids=$({ grep -o '"id": *"HB-[A-Z0-9-]*"' corpus-report/report.json || true; } | sed 's/.*"\(HB-[^"]*\)"/\1/' | sort -u | tr '\n' ' ' | sed 's/ $//')
          echo "exit $GOT_CODE, want $WANT_CODE; findings '$got_ids', want '$WANT_IDS'" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$GOT_CODE" = "$WANT_CODE" ]
          [ "$got_ids" = "$WANT_IDS" ]
